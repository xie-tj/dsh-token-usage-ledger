# Disable the built-in Usage rows when this bundle is layered onto the stock Web profile.
# The target rows are optional: profiles without them simply receive this bundle.
- id: usage-ledger
  name: '@deepseek-ai/dsh-usage-ledger'
  disabled: true

- id: ui-settings-usage
  name: '@deepseek-ai/dsh-client-ui-settings-usage'
  disabled: true

- insert:
    - id: usage-ledger-plugin
      name: 'dsh-plugin-usage-ledger'
