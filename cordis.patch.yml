# Stock 0.2.0 profiles ship no built-in Usage rows, so this bundle only inserts its
# own ledger row and leaves the profile's model and search routes untouched.
- insert:
    - id: usage-ledger-plugin
      name: 'dsh-plugin-usage-ledger'
      config:
        databasePath: !!js dshHomePath('storages/usage-ledger-v4.sqlite')
